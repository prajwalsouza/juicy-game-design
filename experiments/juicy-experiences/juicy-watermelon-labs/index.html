        }

        function stepPiece(piece, dt) {
          const { body, velocity, angular } = piece;
          const playful = mode === "simple";
          const springTarget =
            -piece.dragPressure * (playful ? 2.2 * feel.softness : 1);
          piece.springVelocity +=
            ((springTarget - piece.squash) *
              (playful ? 150 / Math.sqrt(feel.softness) : 320) -
              piece.springVelocity * (playful ? 7 : 28)) *
            dt;
          piece.squash = clamp(
            piece.squash + piece.springVelocity * dt,
            playful ? -0.2 : -0.035,
            playful ? 0.15 : 0.012,
          );
          const height = 1 + piece.squash;
          const width = 1 / Math.sqrt(height);
          body.scale.set(width, height, width);

          if (!piece.resting) {
            velocity.y -= gravity * dt;
            velocity.clampLength(0, 6);
            angular.clampLength(0, 8);
            body.position.addScaledVector(velocity, dt);
            const angularSpeed = angular.length();
            if (angularSpeed > epsilon) {
              spin.setFromAxisAngle(
                scratch.copy(angular).divideScalar(angularSpeed),
                angularSpeed * dt,
              );
              body.quaternion.premultiply(spin).normalize();
            }
            angular.multiplyScalar(Math.exp(-0.55 * dt));
          }

          updateCollider(piece);
          const ground = groundContact(piece);
          if (ground.gap > 0.002) {
            piece.quietTime = 0;
            piece.resting = false;
            return;
          }
          piece.body.position.y -= Math.min(0, ground.gap);
          if (piece.resting) return;

          const { arm, span } = ground;
          const verticalSpeed = contactVelocity(piece, arm).y;
          const bounce = verticalSpeed < -1.1 ? (playful ? 0.16 : 0.025) : 0;
          const support = Math.max(
            0,
            (-verticalSpeed * (1 + bounce)) / resistance(piece, arm, up),
          );
          applyImpulse(piece, arm, up, support);
          frictionImpulse(piece, arm, null, null, up, support, 0.72);
          if (verticalSpeed < -0.65)
            piece.springVelocity -= Math.min(
              playful ? 1.1 : 0.35,
              -verticalSpeed * (playful ? 0.24 : 0.08),
            );

          // Rolling resistance damps small rocking motions. An off-center
          // support still produces torque through the normal impulse above.
          angular.multiplyScalar(Math.exp(-(span > 0.17 ? 8 : 2.6) * dt));
          velocity.x *= Math.exp(-1.8 * dt);
          velocity.z *= Math.exp(-1.8 * dt);
          const stable = Math.hypot(arm.x, arm.z) < 0.07 || span > 0.24;
          const quiet =
            velocity.lengthSq() < 0.0025 &&
            angular.lengthSq() < 0.008 &&
            Math.abs(piece.squash) < 0.009;
          piece.quietTime = stable && quiet ? piece.quietTime + dt : 0;
          if (piece.quietTime > 0.4) {
            piece.resting = true;
            velocity.set(0, 0, 0);
            angular.set(0, 0, 0);
          }
        }

        function simpleStep(dt) {
          for (const p of pieces) stepPiece(p, dt);
          resolveContacts();
        }
        function groundContact(piece) {
          const { position } = piece.body;
          let gap = Infinity;
          const contacts = [];
          for (const point of piece.groundPoints) {
            const floor = onBoard(position.x + point.x, position.z + point.z)
              ? boardTop
              : tableTop;
            const distance = position.y + point.y - floor;
            gap = Math.min(gap, distance);
            contacts.push({ point, distance });
          }
          const arm = vec();
          let count = 0;
          const support = new THREE.Box3();
          for (const { point, distance } of contacts) {
            if (distance > gap + 0.014) continue;
            arm.add(point);
            support.expandByPoint(point);
            count++;
          }
          const span = support.getSize(vec());
          return {
            gap,
            arm: arm.divideScalar(count),
            span: Math.hypot(span.x, span.z),
          };
        }

        function inverseInertiaAt(piece, torque) {
          const rotation = piece.body.quaternion;
          return torque
            .applyQuaternion(rotation.clone().invert())
            .multiply(piece.inverseInertia)
            .applyQuaternion(rotation);
        }

        function resistance(piece, arm, axis) {
          const torque = vec().crossVectors(arm, axis);
          return (
            piece.inverseMass +
            torque.dot(inverseInertiaAt(piece, torque.clone()))
          );
        }

        function contactVelocity(piece, arm) {
          return vec().crossVectors(piece.angular, arm).add(piece.velocity);
        }

        function applyImpulse(piece, arm, axis, impulse) {
          piece.velocity.addScaledVector(axis, impulse * piece.inverseMass);
          piece.angular.addScaledVector(
            inverseInertiaAt(piece, vec().crossVectors(arm, axis)),
            impulse,
          );
        }

        function frictionImpulse(a, armA, b, armB, normal, support, friction) {
          const relative = contactVelocity(a, armA);
          if (b) relative.sub(contactVelocity(b, armB));
          relative.addScaledVector(normal, -relative.dot(normal));
          const speed = relative.length();
          if (speed < epsilon) return;
          const axis = relative.divideScalar(speed);
          const effectiveMass =
            resistance(a, armA, axis) + (b ? resistance(b, armB, axis) : 0);
          const impulse = Math.min(
            speed / effectiveMass,
            friction * support * (mode === "simple" ? feel.friction / 0.55 : 1),
          );
          applyImpulse(a, armA, axis, -impulse);
          if (b) applyImpulse(b, armB, axis, impulse);
        }

        function addAxis(axes, direction) {
          if (direction.lengthSq() < epsilon ** 2) return;
          direction.normalize();
          if (axes.every((axis) => Math.abs(axis.dot(direction)) < 0.999999))
            axes.push(direction);
        }

        function makeCollider(faces, hull) {
          const normals = [];
          const edges = [];
          for (const { points } of faces) {
            const normal = vec();
            for (let i = 0; i < points.length; i++) {
              const next = points[(i + 1) % points.length];
              normal.add(points[i].clone().cross(next));
              addAxis(edges, next.clone().sub(points[i]));
            }
            addAxis(normals, normal);
          }
          return {
            normals,
            edges,
            bounds: new THREE.Box3(),
            points: hull.map(() => vec()),
            worldNormals: normals.map(() => vec()),
            worldEdges: edges.map(() => vec()),
          };
        }

        function updateCollider({
          body,
          hull,
          collider,
          core,
          radius,
          groundPoints,
        }) {
          const down = vec(0, -1, 0)
            .applyQuaternion(body.quaternion.clone().invert())
            .multiply(body.scale);
          down
            .normalize()
            .multiplyScalar(radius)
            .multiply(body.scale)
            .applyQuaternion(body.quaternion);
          core.forEach((point, i) => {
            groundPoints[i]
              .copy(point)
              .multiply(body.scale)
              .applyQuaternion(body.quaternion)
              .add(down);
          });
          for (let i = 0; i < hull.length; i++) {
            collider.points[i]
              .copy(hull[i])
              .multiply(body.scale)
              .applyQuaternion(body.quaternion);
          }
          collider.bounds.setFromPoints(collider.points);
          const inverseScale = vec(
            1 / body.scale.x,
            1 / body.scale.y,
            1 / body.scale.z,
          );
          collider.normals.forEach((normal, i) => {
            collider.worldNormals[i]
              .copy(normal)
              .multiply(inverseScale)
              .applyQuaternion(body.quaternion)
              .normalize();
          });
          collider.edges.forEach((edge, i) => {
            collider.worldEdges[i]
              .copy(edge)
              .multiply(body.scale)
              .applyQuaternion(body.quaternion)
              .normalize();
          });
        }

        function boundsOverlap(a, b) {
          const aBox = a.collider.bounds;
          const bBox = b.collider.bounds;
          for (const axis of ["x", "y", "z"]) {
            const shift = b.body.position[axis] - a.body.position[axis];
            if (
              aBox.max[axis] <= bBox.min[axis] + shift ||
              bBox.max[axis] + shift <= aBox.min[axis]
            )
              return false;
          }
          return true;
        }

        // Separating-axis test on the same deformed convex hulls used to draw the fruit.
        // Support-mapped convex intersection (GJK) and penetration depth (EPA).
        // Avoids the quadratic edge-pair enumeration of SAT on deformed envelopes.
        function findContact(a, b) {
          if (!boundsOverlap(a, b)) return null;
          const support = (direction) => {
            let pa = a.collider.points[0],
              pb = b.collider.points[0],
              da = -Infinity,
              db = Infinity;
            for (const p of a.collider.points) {
              const d = p.dot(direction);
              if (d > da) {
                da = d;
                pa = p;
              }
            }
            for (const p of b.collider.points) {
              const d = p.dot(direction);
              if (d < db) {
                db = d;
                pb = p;
              }
            }
            return pa.clone().add(a.body.position).sub(pb).sub(b.body.position);
          };
          const triple = (a, b, c) => a.clone().cross(b).cross(c);
          let direction = b.body.position.clone().sub(a.body.position);
          if (direction.lengthSq() < 1e-12) direction.set(1, 0.1, 0.2);
          let simplex = [support(direction)];
          direction = simplex[0].clone().negate();
          function line(A, B, AO) {
            const AB = B.clone().sub(A);
            if (AB.dot(AO) > 0) {
              simplex = [B, A];
              direction = triple(AB, AO, AB);
              if (direction.lengthSq() < 1e-16)
                direction = AB.clone().cross(
                  Math.abs(AB.x) < 0.8 ? vec(1, 0, 0) : vec(0, 1, 0),
                );
            } else {
              simplex = [A];
              direction = AO;
            }
            return false;
          }
          function triangle(A, B, C) {
            const AO = A.clone().negate(),
              AB = B.clone().sub(A),
              AC = C.clone().sub(A),
              normal = AB.clone().cross(AC);
            if (normal.clone().cross(AC).dot(AO) > 0) {
              if (AC.dot(AO) > 0) {
                simplex = [C, A];
                direction = triple(AC, AO, AC);
                return false;
              }
              return line(A, B, AO);
            }
            if (AB.clone().cross(normal).dot(AO) > 0) return line(A, B, AO);
            if (normal.dot(AO) > 0) {
              simplex = [C, B, A];
              direction = normal;
            } else {
              simplex = [B, C, A];
              direction = normal.negate();
            }
            return false;
          }
          let enclosed = false;
          for (let iteration = 0; iteration < 32; iteration++) {
            if (direction.lengthSq() < 1e-18) return null;
            const A = support(direction);
            if (A.dot(direction) < 1e-10) return null;
            if (simplex.some((p) => p.distanceToSquared(A) < 1e-18))
              return null;
            simplex.push(A);
            if (simplex.length === 2) {
              line(A, simplex[0], A.clone().negate());
              continue;
            }
            if (simplex.length === 3) {
              triangle(A, simplex[1], simplex[0]);
              continue;
            }
            const B = simplex[2],
              C = simplex[1],
              D = simplex[0],
              AO = A.clone().negate();
            let outside = false;
            for (const [u, v, other] of [
              [B, C, D],
              [C, D, B],
              [D, B, C],
            ]) {
              const normal = u.clone().sub(A).cross(v.clone().sub(A));
              if (normal.dot(other.clone().sub(A)) > 0) normal.negate();
              if (normal.dot(AO) > 1e-10) {
                simplex = [v, u, A];
                direction = normal;
                outside = true;
                break;
              }
            }
            if (!outside) {
              enclosed = true;
              break;
            }
          }
          if (!enclosed) return null;
          const vertices = [...simplex];
          let faces = [];
          function face(i, j, k) {
            const normal = vertices[j]
              .clone()
              .sub(vertices[i])
              .cross(vertices[k].clone().sub(vertices[i]));
            const length = normal.length();
            if (length < 1e-10) return null;
            normal.divideScalar(length);
            let distance = normal.dot(vertices[i]);
            if (distance < 0) {
              [j, k] = [k, j];
              normal.negate();
              distance = -distance;
            }
            return { ids: [i, j, k], normal, distance };
          }
          for (const ids of [
            [0, 1, 2],
            [0, 3, 1],
            [0, 2, 3],
            [1, 3, 2],
          ]) {
            const f = face(...ids);
            if (f) faces.push(f);
          }
          let nearest;
          for (let iteration = 0; iteration < 40 && faces.length; iteration++) {
            nearest = faces.reduce((best, f) =>
              f.distance < best.distance ? f : best,
            );
            const point = support(nearest.normal),
              advance = point.dot(nearest.normal) - nearest.distance;
            if (
              advance < 0.00004 ||
              vertices.some((v) => v.distanceToSquared(point) < 1e-16)
            )
              return nearest.distance > 0.00001
                ? { normal: nearest.normal, depth: nearest.distance }
                : null;
            const index = vertices.length;
            vertices.push(point);
            const boundary = [];
            const edge = (i, j) => {
              const reverse = boundary.findIndex(
                (e) => e[0] === j && e[1] === i,
              );
              if (reverse >= 0) boundary.splice(reverse, 1);
              else boundary.push([i, j]);
            };
            faces = faces.filter((f) => {
              if (f.normal.dot(point.clone().sub(vertices[f.ids[0]])) <= 1e-8)
                return true;
              edge(f.ids[0], f.ids[1]);
              edge(f.ids[1], f.ids[2]);
              edge(f.ids[2], f.ids[0]);
              return false;
            });
            for (const [i, j] of boundary) {
              const f = face(i, j, index);
              if (f) faces.push(f);
            }
            if (faces.length > 200) break;
          }
          return nearest && nearest.distance > 0.00001
            ? { normal: nearest.normal, depth: nearest.distance }
            : null;
        }

        function supportOffset(collider, direction) {
          let farthest = -Infinity;
          for (const point of collider.points)
            farthest = Math.max(farthest, point.dot(direction));
          const offset = vec();
          let count = 0;
          for (const point of collider.points) {
            if (point.dot(direction) >= farthest - 0.015) {
              offset.add(point);
              count++;
            }
          }
          return offset.divideScalar(count);
        }

        function separate(a, b, { normal, depth }) {
          const separation = depth + 0.0003;
          const aFloor = normal.y > epsilon ? groundContact(a).gap : 0;
          const bFloor = normal.y < -epsilon ? groundContact(b).gap : 0;
          const aRoom =
            normal.y > epsilon ? Math.max(0, aFloor) / normal.y : Infinity;
          const bRoom =
            normal.y < -epsilon ? Math.max(0, bFloor) / -normal.y : Infinity;
          const aShare = clamp(
            (separation * a.inverseMass) / (a.inverseMass + b.inverseMass),
            Math.max(0, separation - bRoom),
            Math.min(separation, aRoom),
          );
          a.body.position.addScaledVector(normal, -aShare);
          b.body.position.addScaledVector(normal, separation - aShare);
          if (aShare > 0.0003) a.resting = false;
          if (separation - aShare > 0.0003) b.resting = false;
        }

        function contactImpulse(a, b, normal) {
          const contactPoint = supportOffset(a.collider, normal)
            .add(a.body.position)
            .add(
              supportOffset(b.collider, normal.clone().negate()).add(
                b.body.position,
              ),
            )
            .multiplyScalar(0.5);
          const armA = contactPoint.clone().sub(a.body.position);
          const armB = contactPoint.clone().sub(b.body.position);
          const closing = contactVelocity(a, armA)
            .sub(contactVelocity(b, armB))
            .dot(normal);
          if (closing <= 0) return;
          const effectiveMass =
            resistance(a, armA, normal) + resistance(b, armB, normal);
          const impulse = (closing * (closing > 1 ? 1.04 : 1)) / effectiveMass;
          applyImpulse(a, armA, normal, -impulse);
          applyImpulse(b, armB, normal, impulse);
          frictionImpulse(a, armA, b, armB, normal, impulse, 0.65);
          if (closing > 0.8) {
            a.springVelocity -= Math.min(0.18, impulse * a.inverseMass * 0.07);
            b.springVelocity -= Math.min(0.18, impulse * b.inverseMass * 0.07);
          }
          if (closing < 0.6) {
            // Dissipation from flesh deformation at sustained contact.
            a.angular.multiplyScalar(0.94);
            b.angular.multiplyScalar(0.94);
            a.velocity.multiplyScalar(0.98);
            b.velocity.multiplyScalar(0.98);
          }
          if (closing > 0.2) a.quietTime = b.quietTime = 0;
          a.resting = b.resting = false;
        }

        function resolveContacts() {
          // Resolve chains of contacts within the same step before presenting the frame.
          for (let pass = 0; pass < (mode === "simple" ? 12 : 32); pass++) {
            let changed = false;
            for (let i = 0; i < pieces.length; i++) {
              const a = pieces[i];
              for (let j = i + 1; j < pieces.length; j++) {
                const b = pieces[j];
                const contact = findContact(a, b);
                if (!contact) continue;
                separate(a, b, contact);
                contactImpulse(a, b, contact.normal);
                changed = true;
              }
            }
            for (const piece of pieces) {
              const gap = groundContact(piece).gap;
              if (gap < 0) piece.body.position.y -= gap;
              resolveBoard(piece);
            }
            if (!changed) return;
          }
          // Unresolved contacts continue in the next 120 Hz substep; never teleport a pile upward.
        }

        // A finite, solid convex slab, including side walls and underside.
        // Top support uses the rounded fruit; side contacts use its conservative hull.
        let solidBoard;
        function boardCollider() {
          const ring = boardShape(5.9, 3.55, 0.29)
            .getPoints(4)
            .map((p) => vec(p.x, 0, -p.y));
          ring.pop();
          const bottom = ring.map((p) => vec(p.x, 0, p.z));
          const top = ring.map((p) => vec(p.x, boardTop, p.z));
          const faces = [{ points: bottom }, { points: [...top].reverse() }];
          for (let i = 0; i < ring.length; i++) {
            const j = (i + 1) % ring.length;
            faces.push({ points: [bottom[i], bottom[j], top[j], top[i]] });
          }
          const hull = [...bottom, ...top];
          const body = new THREE.Group();
          const collider = makeCollider(faces, hull);
          const board = {
            body,
            hull,
            collider,
            core: hull,
            radius: 0,
            groundPoints: hull.map(() => vec()),
          };
          updateCollider(board);
          return board;
        }
        function resolveBoard(piece) {
          solidBoard ??= boardCollider();
          const hit = findContact(solidBoard, piece);
          if (!hit) return;
          // The dedicated support manifold handles the top, avoiding a bevel-sized air gap.
          if (hit.normal.y > 0.8) {
            const ground = groundContact(piece);
            if (ground.gap < 0.006) return;
          }
          piece.body.position.addScaledVector(hit.normal, hit.depth + 0.0001);
          const arm = supportOffset(
            piece.collider,
            hit.normal.clone().negate(),
          );
          const closing = contactVelocity(piece, arm).dot(hit.normal);
          if (closing < 0) {
            const impulse = -closing / resistance(piece, arm, hit.normal);
            applyImpulse(piece, arm, hit.normal, impulse);
            frictionImpulse(piece, arm, null, null, hit.normal, impulse, 0.65);
          }
          piece.resting = false;
        }

        function sound(energy) {
          const Audio = window.AudioContext || window.webkitAudioContext;
          if (!Audio) return;
          try {
            audio ??= new Audio();
            if (audio.state === "suspended") audio.resume().catch(() => {});
            const duration = 0.16;
            const buffer = audio.createBuffer(
              1,
              Math.round(audio.sampleRate * duration),
              audio.sampleRate,
            );
            const noise = buffer.getChannelData(0);
            for (let i = 0; i < noise.length; i++)
              noise[i] = random(-1, 1) * (1 - i / noise.length) ** 2;
            const source = audio.createBufferSource();
            source.buffer = buffer;
            const filter = audio.createBiquadFilter();
            filter.type = "lowpass";
            filter.frequency.setValueAtTime(2200 * energy, audio.currentTime);
            filter.frequency.exponentialRampToValueAtTime(
              280,
              audio.currentTime + duration,
            );
            const gain = audio.createGain();
            gain.gain.value = 0.22;
            source.connect(filter).connect(gain).connect(audio.destination);
            source.start();
          } catch {
            // Audio is optional in browsers that restrict playback.
          }
        }

        const svg = document.querySelector("#gesture");
        const stroke = document.querySelector("#stroke");
        const fps = document.querySelector("#fps");
        const knifeBasis = new THREE.Matrix4();
        const cutsValue = document.querySelector("#cuts");
        const piecesValue = document.querySelector("#pieces");
        const raycaster = new THREE.Raycaster();
        const canvas = renderer.domElement;

        function resize() {
          const { width, height } = stage.getBoundingClientRect();
          if (!width || !height) return;
          camera.aspect = width / height;
          camera.fov = Math.max(
            28,
            THREE.MathUtils.radToDeg(2 * Math.atan(0.335 / camera.aspect)),
          );
          camera.updateProjectionMatrix();
          renderer.setSize(stage.clientWidth, stage.clientHeight, false);
          svg.setAttribute(
            "viewBox",
            `0 0 ${stage.clientWidth} ${stage.clientHeight}`,
          );
        }

        function point(event) {
          const box = canvas.getBoundingClientRect();
          return new THREE.Vector2(
            event.clientX - box.left,
            event.clientY - box.top,
          );
        }

        function ndc(point) {
          return new THREE.Vector2(
            (2 * point.x) / stage.clientWidth - 1,
            1 - (2 * point.y) / stage.clientHeight,
          );
        }

        function throughScreen(point) {
          const p = ndc(point);
          return vec(p.x, p.y, 0.5).unproject(camera);
        }

        function showStroke(from, to, trace = true) {
          stroke.setAttribute("x1", from.x);
          stroke.setAttribute("y1", from.y);
          stroke.setAttribute("x2", to.x);
          stroke.setAttribute("y2", to.y);
          svg.toggleAttribute("hidden", !trace);
          positionKnife(from, to);
        }

        function positionKnife(from, to) {
          const backwards = throughScreen(from).sub(throughScreen(to));
          if (backwards.lengthSq() < epsilon)
            backwards
              .copy(throughScreen(to.clone().add(new THREE.Vector2(35, -23))))
              .sub(throughScreen(to));
          backwards.normalize();
          const outward = camera.getWorldDirection(vec()).negate();
          const sideways = vec().crossVectors(outward, backwards).normalize();
          knife.quaternion.setFromRotationMatrix(
            knifeBasis.makeBasis(backwards, sideways, outward),
          );
          const ray = throughScreen(to).sub(camera.position);
          knife.position
            .copy(camera.position)
            .addScaledVector(ray, 7.65 / -ray.dot(outward))
            .addScaledVector(backwards, 1.39);
        }

        function updateCounts() {
          const released = materialBudget.liquid + materialBudget.pulp,
            percent = materialBudget.initial
              ? (100 * released) / materialBudget.initial
              : 0;
          document.querySelector("#materialReadout").textContent =
            `Fruit ${(100 - percent).toFixed(1)}% · Released ${percent.toFixed(1)}%`;
          cutsValue.textContent = cuts;
          piecesValue.textContent = pieces.length;
          resetLink.classList.toggle("fresh", boardFull());
          document.querySelector("#freshLabel").hidden = !boardFull();
        }

        function boardFull() {
          return cuts >= maxCuts || pieces.length >= maxPieces;
        }

        function splitPiece(
          piece,
          worldPlane,
          energy,
          travel = vec(0, -1, 0),
          fracture = false,
          depth = 1,
        ) {
          wakeMaterial();
          const inverse = piece.mesh.matrixWorld.clone().invert();
          const localPlane = worldPlane.clone().applyMatrix4(inverse);
          const middle = splitHull(piece.faces, localPlane);
          if (!middle) return false;
          // Finite kerf: the blade removes a thin band. All spray comes from this band.
          const kerf = fracture ? 0 : feel.juice * (mode === "simple" ? 3 : 1);
          const positivePlane = localPlane.clone();
          positivePlane.constant -= kerf / 2;
          const negativePlane = localPlane.clone();
          negativePlane.constant += kerf / 2;
          const upper = splitHull(piece.faces, positivePlane),
            lower = splitHull(piece.faces, negativePlane);
          if (!upper || !lower) return false;
          const split = {
            halves: [upper.halves[0], lower.halves[1]],
            properties: [upper.properties[0], lower.properties[1]],
            ring: middle.ring,
            origin: middle.origin,
          };
          const currentVolume = massProperties(piece.faces).volume;
          const geometricTotal = split.properties.reduce(
            (sum, part) => sum + part.volume,
            0,
          );
          const retainedFraction = fracture
            ? 1
            : clamp(geometricTotal / currentVolume, 0, 1);
          const retainedMass = piece.volume * retainedFraction;
          split.properties.forEach(
            (part) =>
              (part.volume = (retainedMass * part.volume) / geometricTotal),
          );
          const lostVolume = piece.volume - retainedMass;
          const origin = piece.mesh.localToWorld(split.origin.clone());
          const seam = split.ring.map((p) =>
            piece.mesh.localToWorld(p.clone()),
          );
          const direction = worldPlane.normal;

          const separationImpulse =
            ((mode === "simple" ? 1.1 : 0.08) *
              feel.cut *
              energy *
              split.properties[0].volume *
              split.properties[1].volume) /
            piece.volume;
          const children = [];
          split.halves.forEach((faces, index) => {
            const sign = index === 0 ? 1 : -1;
            const seeds = piece.seeds.filter(
              (seed) => sign * localPlane.distanceToPoint(seed.point) > 0.046,
            );
            const localTravel = travel.clone().transformDirection(inverse);
            faces[faces.length - 1].cut = { travel: localTravel };
            const child = addPiece(
              faces,
              seeds,
              split.properties[index],
              piece,
            );
            children.push(child);
            const arm = origin.clone().sub(child.body.position);
            child.body.position.addScaledVector(direction, sign * 0.002);
            applyImpulse(child, arm, direction, sign * separationImpulse);
            if (!fracture) {
              const grip = 0.18 * feel.friction * energy;
              child.velocity.addScaledVector(travel, grip);
            }

            child.springVelocity = (mode === "simple" ? -1.6 : -0.12) * energy;
            if (mode === "simple") {
              child.velocity.y += reducedMotion ? 0.15 : 0.65;
              child.angular.add(vec(sign * 0.3, sign * 0.2, sign * 0.55));
            }
            updateCollider(child);
          });
          removePiece(piece);
          if (mode === "advanced" && depth < 0.98)
            bridgeCut(children[0], children[1], worldPlane, depth, travel);
          spray(seam, origin, worldPlane.normal, energy, travel, lostVolume);
          return true;
        }

        function cutPlane(from, to) {
          return new THREE.Plane().setFromCoplanarPoints(
            camera.position,
            throughScreen(from),
            throughScreen(to),
          );
        }

        function hitAt(at, meshes) {
          raycaster.setFromCamera(ndc(at), camera);
          return raycaster.intersectObjects(meshes, false)[0]?.object;
        }

        function finishSlice(from, to, energy) {
          cuts++;
          for (const piece of pieces) {
            piece.body.position.y -= Math.min(0, groundContact(piece).gap);
          }
          updateCounts();
          sound(energy);
          hint.textContent = boardFull()
            ? "Board full · Start with a new watermelon"
            : "Tap or swipe to slice again";
          showStroke(from, to);
          traceUntil = performance.now() + 145;
        }

        function applySwipe(from, to, elapsed) {
          if (boardFull() || from.distanceTo(to) < 12) return false;
          scene.updateMatrixWorld(true);
          const distance = from.distanceTo(to);
          const steps = clamp(Math.ceil(distance / 8), 3, 100);
          const meshes = pieces.map((piece) => piece.mesh);
          const targets = new Set();
          for (let i = 0; i <= steps; i++) {
            const hit = hitAt(from.clone().lerp(to, i / steps), meshes);
            if (hit) targets.add(hit);
          }
          const plane = cutPlane(from, to);
          const energy =
            (reducedMotion ? 0.67 : 1) *
            clamp(0.8 + (distance / Math.max(elapsed, 65)) * 0.46, 0.82, 1.44);
          let count = 0;
          for (const piece of [...pieces]) {
            if (pieces.length >= maxPieces) break;
            if (
              targets.has(piece.mesh) &&
              splitPiece(
                piece,
                plane,
                energy,
                throughScreen(to).sub(throughScreen(from)).normalize(),
                false,
                clamp(distance / 210, 0.2, 1),
              )
            )
              count++;
          }
          if (!count) return false;
          finishSlice(from, to, energy);
          return true;
        }

        function screenPosition(world) {
          const projected = world.clone().project(camera);
          return new THREE.Vector2(
            ((projected.x + 1) * stage.clientWidth) / 2,
            ((1 - projected.y) * stage.clientHeight) / 2,
          );
        }

        function applyTap(at, keyboard = false) {
          if (boardFull()) return false;
          scene.updateMatrixWorld(true);
          const hit = keyboard
            ? null
            : hitAt(
                at,
                pieces.map((piece) => piece.mesh),
              );
          const piece = keyboard
            ? pieces.reduce((largest, candidate) =>
                candidate.volume > largest.volume ? candidate : largest,
              )
            : pieces.find((candidate) => candidate.mesh === hit);
          if (!piece) return false;
          const bridge = bridges.find(
            (link) => link.a === piece || link.b === piece,
          );
          if (bridge) {
            bridges.splice(bridges.indexOf(bridge), 1);
            wakeMaterial();
            cuts++;
            updateCounts();
            hint.textContent = "Cut through the remaining tissue";
            return true;
          }

          const center = screenPosition(piece.body.position);
          const anchors = keyboard ? [center] : [at];
          const energy = reducedMotion ? 0.67 : 1;
          for (const anchor of anchors) {
            for (const tilt of [
              0.24 + 0.14 * Math.sin(cuts * 2.17),
              -0.72,
              1.15,
            ]) {
              const direction = new THREE.Vector2(-tilt, 1).normalize();
              const from = anchor.clone().addScaledVector(direction, -48);
              const to = anchor.clone().addScaledVector(direction, 24);
              if (
                splitPiece(
                  piece,
                  cutPlane(from, to),
                  energy,
                  throughScreen(to).sub(throughScreen(from)).normalize(),
                  false,
                  keyboard ? 1 : 0.6,
                )
              ) {
                finishSlice(from, to, energy);
                return true;
              }
            }
          }
          return false;
        }

        function reset() {
          stainBatch.geometry =
            mode === "simple" ? simpleStainGeometry : advancedStainGeometry;
          stainBatch.material.color.setHex(
            mode === "simple" ? 0xf69caa : 0xffc9b5,
          );
          stainBatch.material.opacity = mode === "simple" ? 0.36 : 0.38;
          stainBatch.castShadow = stainBatch.receiveShadow = mode !== "simple";
          dropletBatch.material.color.setHex(
            mode === "simple" ? 0xffa4b4 : 0xffc2a3,
          );
          dropletBatch.castShadow = mode !== "simple";
          document.querySelector(
            "#feel-softness",
          ).previousElementSibling.firstChild.nodeValue =
            mode === "simple" ? "Wobble" : "Flesh softness";
          bridges.length = 0;
          wakeMaterial();
          if (drag) endDrag();
          for (const piece of [...pieces]) removePiece(piece);
          droplets.length = 0;
          pendingSpray.length = 0;
          crumbs.length = 0;
          splashRings.length = 0;
          stains.length = 0;
          cuts = 0;
          traceUntil = 0;
          knife.position.copy(parkedKnifePosition);
          knife.quaternion.copy(parkedKnifeRotation);
          svg.setAttribute("hidden", "");
          const faces = fruitHull();
          materialBudget.initial = massProperties(faces).volume;
          materialBudget.liquid = materialBudget.pulp = 0;
          const seeds = seedLayout.flatMap(([x, y, angle]) => [
            { point: vec(x, y, 0.484), angle },
            { point: vec(-x, y, -0.484), angle: -angle },
          ]);
          const whole = addPiece(faces, seeds, massProperties(faces));
          if (mode === "advanced") {
            whole.soft = makeSoftBody(whole);
            whole.asleep = true;
            whole.supported = true;
            drawMaterial(whole);
            syncSoftFaces(whole);
            smoothSurface(whole.mesh.geometry);
            whole.mesh.geometry.computeBoundingSphere();
            refreshSoftCollider(whole);
          } else {
            updateCollider(whole);
            refitSurface(whole.mesh);
          }
          updateCounts();
          hint.textContent =
            mode === "simple"
              ? "Tap to slice · Hold to squish"
              : "Tap or swipe across the fruit";
        }

        function endDrag() {
          const previous = drag;
          drag = null;
          for (const piece of pieces) piece.dragPressure = 0;
          if (stage.hasPointerCapture(previous.id))
            stage.releasePointerCapture(previous.id);
          svg.setAttribute("hidden", "");
          return previous;
        }

        stage.addEventListener("pointerdown", (event) => {
          if (drag || boardFull() || !event.isPrimary || event.button !== 0)
            return;
          const start = point(event);
          wakeMaterial();
          const target = hitAt(
            start,
            pieces.map((p) => p.mesh),
          );
          const selected = pieces.find((p) => p.mesh === target);
          if (selected) {
            const hit = raycaster.intersectObject(target, false)[0];
            selected.pressPoint = hit.point.clone();
            selected.pressDirection = raycaster.ray.direction.clone();
            selected.dragPressure = 0.08;
          }
          drag = {
            id: event.pointerId,
            start,
            since: performance.now(),
            sliced: false,
            moved: false,
          };
          stage.setPointerCapture(event.pointerId);
          showStroke(start, start, false);
        });
        stage.addEventListener("pointermove", (event) => {
          if (drag?.id !== event.pointerId) return;
          const end = point(event);
          if (drag.sliced) {
            showStroke(drag.start, end, false);
            return;
          }
          drag.moved ||= drag.start.distanceTo(end) >= 12;
          showStroke(drag.start, end, drag.moved);
          if (
            drag.moved &&
            applySwipe(drag.start, end, performance.now() - drag.since)
          ) {
            drag.sliced = true;
            for (const piece of pieces) piece.dragPressure = 0;
            return;
          }
          const hit = hitAt(
            end,
            pieces.map((piece) => piece.mesh),
          );
          for (const piece of pieces)
            piece.dragPressure = piece.mesh === hit ? 0.06 : 0;
        });
        stage.addEventListener("pointerup", (event) => {
          if (drag?.id !== event.pointerId) return;
          const previous = endDrag();
          if (previous.sliced) return;
          const end = point(event);
          if (previous.moved || previous.start.distanceTo(end) >= 12) {
            applySwipe(previous.start, end, performance.now() - previous.since);
          } else {
            applyTap(end);
          }
        });
        for (const name of ["pointercancel", "lostpointercapture"]) {
          stage.addEventListener(name, (event) => {
            if (drag?.id === event.pointerId) endDrag();
          });
        }

        stage.addEventListener("keydown", (event) => {
          if (event.repeat || (event.key !== "Enter" && event.key !== " "))
            return;
          event.preventDefault();
          applyTap(null, true);
        });
        resetLink.addEventListener("click", (event) => {
          event.preventDefault();
          reset();
        });

        const tuner = document.querySelector("#tuner"),
          editFeel = document.querySelector("#editFeel");
        function closeTuner() {
          tuner.hidden = true;
          editFeel.setAttribute("aria-expanded", "false");
          editFeel.focus();
        }
        editFeel.addEventListener("click", () => {
          tuner.hidden = !tuner.hidden;
          editFeel.setAttribute("aria-expanded", String(!tuner.hidden));
          if (!tuner.hidden) tuner.querySelector("input").focus();
        });
        document
          .querySelector("#closeFeel")
          .addEventListener("click", closeTuner);
        tuner.addEventListener("keydown", (e) => {
          if (e.key === "Escape") {
            e.preventDefault();
            closeTuner();
          }
        });
        function showFeel() {
          for (const input of tuner.querySelectorAll("[data-feel]")) {
            const k = input.dataset.feel;
            input.value = feel[k];
            document.querySelector("#value-" + k).value =
              k === "juice"
                ? `${Math.round(feel[k] / 0.001)} / 10`
                : k === "friction"
                  ? `${Math.round(feel[k] * 100)}%`
                  : `${feel[k].toFixed(1)}×`;
          }
        }
        tuner.addEventListener("input", (e) => {
          const k = e.target.dataset.feel;
          if (!k) return;
          feel[k] = Number(e.target.value);
          showFeel();
          wakeMaterial();
        });
        document.querySelector("#defaultFeel").addEventListener("click", () => {
          Object.assign(feel, defaultFeel);
          showFeel();
          wakeMaterial();
        });
        showFeel();
        for (const button of document.querySelectorAll(".mode-switch button"))
          button.addEventListener("click", () => {
            if (mode === button.dataset.mode) return;
            mode = button.dataset.mode;
            document.body.dataset.mode = mode;
            for (const other of document.querySelectorAll(
              ".mode-switch button",
            ))
              other.setAttribute("aria-pressed", String(other === button));
            tuner.hidden = true;
            editFeel.setAttribute("aria-expanded", "false");
            document.querySelector(".tuner p").textContent =
              mode === "simple"
                ? "More wobble, more splash. Hold the fruit to give it a squeeze."
                : "Change the feel. Hold to press, tap to nick, or swipe for a deeper cut.";
            reset();
          });
        new ResizeObserver(resize).observe(stage);
        resize();
        reset();
        let lastTime = performance.now();
        let fpsSince = lastTime;
        let frames = 0;
        let qualitySince = 0;
        let accumulator = 0;
        const step = 1 / 60;
        renderer.setAnimationLoop((time) => {
          const frameTime = clamp((time - lastTime) / 1000, 0, 0.05);
          // Bound catch-up work so a slow rendered frame cannot start a CPU spiral.
          accumulator = Math.min(accumulator + frameTime, 2 * step);
          frames++;
          if (time - fpsSince >= 650) {
            const measuredFPS = (frames * 1000) / (time - fpsSince);
            fps.textContent = `${Math.round(measuredFPS)} fps`;
            if (time - qualitySince > 5000 && measuredFPS < 38) {
              renderer.setPixelRatio(
                Math.max(0.8, renderer.getPixelRatio() * 0.85),
              );
              qualitySince = time;
            }
            frames = 0;
            fpsSince = time;
          }
          lastTime = time;
          while (accumulator >= step) {
            if (mode === "simple") simpleStep(step);
            else softStep(step);
            accumulator -= step;
          }
          for (const p of pieces)
            if (p.materialDirty) {
              drawMaterial(p);
              p.materialDirty = false;
            }
          stepLiquid(Math.min(frameTime, 1 / 30));
          stepPlayfulEffects(Math.min(frameTime, 1 / 30));
          paintLiquid();
          if (!drag && time >= traceUntil) {
            svg.setAttribute("hidden", "");
            const returnAmount = reducedMotion
              ? 1
              : 1 - Math.exp(-14 * frameTime);
            knife.position.lerp(parkedKnifePosition, returnAmount);
            knife.quaternion.slerp(parkedKnifeRotation, returnAmount);
          }
          for (const p of pieces)
            if (p.surfaceDirty) {
              smoothSurface(p.mesh.geometry);
              p.mesh.geometry.computeBoundingSphere();
              p.surfaceDirty = false;
            }
          renderer.render(scene, camera);
        });
      }
    </script>
  </body>
</html>
